# Builds the container image, gates it on Trivy, and on main pushes it to
# ghcr.io/alanheinen/iptv-epg with an SBOM and BuildKit provenance.
#
# Same shape as k8s-2025's image workflows (meshcentral.yml): actions pinned
# to commit SHAs because this pushes images that run in the cluster. The
# cluster runs a digest pinned in k8s-2025
# (config/applications/signal-tv/signal-tv.yaml); moving it to a new build is
# a reviewed change there, not something this workflow does.
name: image

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/alanheinen/iptv-epg

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Syntax check
        run: python3 -m py_compile scripts/build.py scripts/serve.py

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: iptv-epg:ci

      - name: Smoke test (read-only, non-root, builds its own guide)
        run: |
          set -euo pipefail
          docker run -d --name smoke --read-only --tmpfs /data:uid=1000,gid=1000 -p 8080:8080 iptv-epg:ci
          for i in $(seq 1 60); do
            curl -fsS localhost:8080/healthz && break
            sleep 2
          done
          curl -fsS localhost:8080/healthz
          curl -fsS -o /dev/null localhost:8080/
          curl -fsS localhost:8080/api/health
          docker logs smoke | tail -5
          docker rm -f smoke

      - name: Trivy gate (fixable CRITICAL fails the build)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.75.0
          image-ref: iptv-epg:ci
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push with SBOM and provenance
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          sbom: true
          provenance: mode=max

      - name: Summary
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          ref="${IMAGE}:sha-${GITHUB_SHA}@${DIGEST}"
          echo "Pushed \`${ref}\`. Deploy it by pinning this ref in k8s-2025 config/applications/signal-tv/signal-tv.yaml." >> "$GITHUB_STEP_SUMMARY"
          echo "$ref"
